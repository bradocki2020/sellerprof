plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.pimata.vendaunica'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.pimata.vendaunica.oficial'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.3.3'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
