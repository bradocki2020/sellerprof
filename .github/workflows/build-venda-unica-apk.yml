name: Build Venda Unica APK and AAB

on:
  push:
    branches:
      - venda-unica-android
    paths:
      - 'venda-unica-android/**'
      - '.github/workflows/build-venda-unica-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK and AAB
        working-directory: venda-unica-android
        run: gradle --no-daemon clean assembleDebug assembleRelease bundleRelease

      - name: Prepare artifacts
        run: |
          cp venda-unica-android/app/build/outputs/apk/debug/app-debug.apk VendaUnica-v1.3.0-debug.apk
          cp venda-unica-android/app/build/outputs/apk/release/app-release-unsigned.apk VendaUnica-v1.3.0-release-unsigned.apk
          cp venda-unica-android/app/build/outputs/bundle/release/app-release.aab VendaUnica-v1.3.0-release-unsigned.aab
          sha256sum VendaUnica-v1.3.0-debug.apk VendaUnica-v1.3.0-release-unsigned.apk VendaUnica-v1.3.0-release-unsigned.aab > VendaUnica-v1.3.0-unsigned.sha256.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VendaUnica-v1.3.0-UNSIGNED
          path: |
            VendaUnica-v1.3.0-debug.apk
            VendaUnica-v1.3.0-release-unsigned.apk
            VendaUnica-v1.3.0-release-unsigned.aab
            VendaUnica-v1.3.0-unsigned.sha256.txt
          if-no-files-found: error
          retention-days: 30
