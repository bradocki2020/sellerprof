name: Build Venda Unica APK

on:
  push:
    branches:
      - venda-unica-android
    paths:
      - 'venda-unica-android/**'
      - '.github/workflows/build-venda-unica-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: venda-unica-android
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare artifact
        run: |
          cp venda-unica-android/app/build/outputs/apk/debug/app-debug.apk VendaUnica-v1.2.0.apk
          sha256sum VendaUnica-v1.2.0.apk > VendaUnica-v1.2.0.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VendaUnica-v1.2.0-APK
          path: |
            VendaUnica-v1.2.0.apk
            VendaUnica-v1.2.0.sha256.txt
          if-no-files-found: error
          retention-days: 30
